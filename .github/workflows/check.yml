name: Check

# Runs on every pull request so changes from any person or AI agent are verified before merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Type and content check
        run: npm run check
      - name: Build (fails if a frozen QR route is missing)
        run: npm run build
