# Master project catalog (public showcase + repo-side project hub).
#
# Fields:
#   mark:       1–4 characters drawn as a halftone logo, or one of: code, note, ball, pin.
#   category:   work | personal | play
#   status:     live | in-progress | next | idea | paused | archived
#   visibility: public | internal  (defaults to internal; only `public` renders on /portfolio)
#   platform:   where it lives or is built (Anti-Gravity, Google AI Studio, Google Sheets, Salesforce, Astro, etc.)
#   tags:       short topic labels for grouping in hub/OVERVIEW.md
#   nextStep:   concrete next action for the hub (never rendered on the public site)
#   note:       optional Markdown note in hub/, e.g. hub/projects/my-project.md
#   repo:       optional GitHub or workspace URL (hub metadata)
#   link:       optional live URL shown on /portfolio when visibility is public
#   linkText:   optional label for link
#
# Privacy note: this repository is public. Keep financial data, account numbers, credentials,
# and employer internals out of this file and out of hub/. See hub/PRIVATE-APPS.md.
# After editing this file, run `npm run hub` to refresh hub/OVERVIEW.md.

